name: two-router

topology:
  nodes:
    r1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - r1-daemons:/etc/frr/daemons
    r2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - r2-daemons:/etc/frr/daemons

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
